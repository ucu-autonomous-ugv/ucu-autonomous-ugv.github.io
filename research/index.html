<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Research | UCU UGV Club</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arsenal:ital,wght@0,400;0,700;1,400;1,700&family=Manrope:wght@300;400;500;600;700;800&family=Fira+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <site-header></site-header>

    <main class="site-main">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow">Academic & Applied Portfolio</p>
          <h1>Research</h1>
          <p class="lead">
            Explore our research initiatives, projects, student theses, and academic publications in autonomous vehicles.
          </p>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="research-layout">
            <aside class="research-sidebar">
              <nav class="research-nav" aria-label="Research Categories">
                <button class="research-nav-btn is-active" data-tab="all">
                  All Research <span class="count" data-count="all">0</span>
                </button>
                <button class="research-nav-btn" data-tab="projects">
                  Projects <span class="count" data-count="projects">0</span>
                </button>
                <button class="research-nav-btn" data-tab="theses">
                  Theses <span class="count" data-count="theses">0</span>
                </button>
                <button class="research-nav-btn" data-tab="publications">
                  Publications <span class="count" data-count="publications">0</span>
                </button>
              </nav>
            </aside>

            <div class="research-content-area">
              <div class="list-grid" data-section="research"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <site-footer></site-footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/assets/js/site.js?v=2"></script>
    <script src="/assets/js/content.js?v=2"></script>
  </body>
</html>
